name: Build Tatkal Fast Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TatkalFastAssistant-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
