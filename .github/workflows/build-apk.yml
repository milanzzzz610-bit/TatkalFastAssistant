name: Build Tatkal Fast Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q "TatkalFastAssistant-Android-Project (1).zip" -d android-project

      - name: Find Gradle wrapper
        run: |
          find android-project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TatkalFastAssistant-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
